name: 模块或函数说明
description: 讲清楚这部分代码做什么、谁会使用、出错后怎么办
title: "[设计] "
labels: ["type:design", "status:proposal"]
body:
  - type: input
    id: identity
    attributes:
      label: 说明哪项工作、哪部分代码
      description: 关联已有需求与源码目录条目，或说明新增接口。
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: 这部分负责什么
      description: 说明它保存和检查什么，与其他部分怎样配合，目前缺什么。
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: 接收什么、做什么、返回什么
      description: 说明使用的资料和版本、实际读写或操作，以及失败或结果不明时怎样反馈。
    validations:
      required: true
  - type: textarea
    id: lifecycle
    attributes:
      label: 重复、打断和版本变化后怎么办
      description: 重复请求、多人同时操作、打断、恢复和升级时，相关部分怎样继续工作。
  - type: textarea
    id: verification
    attributes:
      label: 说明依据和检查方法
      description: 方案写在哪里，哪些地方还没有决定，怎样检查正常、失败和恢复的行为。
    validations:
      required: true
