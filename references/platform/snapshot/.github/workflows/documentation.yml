name: Documentation

on:
  push:
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.github/**'
      - 'packages/**/src/**'
      - 'packages/**/scripts/**'
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.github/**'
      - 'packages/**/src/**'
      - 'packages/**/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check documentation and source-bound function catalog
        run: node .github/scripts/check-docs.ts
