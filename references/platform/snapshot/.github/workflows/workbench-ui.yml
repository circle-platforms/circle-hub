name: Workbench UI

on:
  push:
    paths:
      - 'packages/workbench-ui/**'
      - '.github/workflows/workbench-ui.yml'
  pull_request:
    paths:
      - 'packages/workbench-ui/**'
      - '.github/workflows/workbench-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/workbench-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/workbench-ui/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run test:plugins
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
