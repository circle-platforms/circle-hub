# Version updates for the Hub's own dependencies and for the actions the workflows pin by commit SHA.
# foundation/circle and references/ are frozen bytes (AGENTS.md, Source and reference ownership): Dependabot must not
# open pull requests for their manifests. exclude-paths keeps them out of version updates only; the frozen entry at the
# end ignores every dependency there, and ignore conditions apply to security updates as well, so an advisory against
# one of their lock files raises an alert but no pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    exclude-paths:
      - 'foundation/**'
      - 'references/**'
    schedule:
      interval: weekly
    ignore:
      # The Hub runs on Node 24 (package.json engines); types from a later major describe APIs it does not have.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Pack publication checks a function's imports with TypeScript's JavaScript compiler API (hub/runs/packs/imports.ts),
      # as several tests do. TypeScript 7, the native port, does not provide that API, so every pack publication fails with
      # it (#53). 6.x keeps the API and still comes; moving to 7 means replacing that checker first.
      - dependency-name: 'typescript'
        versions: ['>= 7']
      # The Windows adapters (hub/platform/windows-*.ts, hub/rules/sandbox/windows.ts) load koffi only on Windows and refuse
      # every version but the reviewed 3.3.3, the one the Circle client pins; an update would make them fail closed there.
      # koffi pins its per-platform @koromix packages exactly. Moving to another version means reviewing the native calls
      # and changing those checks together, by hand.
      - dependency-name: 'koffi'
      - dependency-name: '@koromix/koffi-*'
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    exclude-paths:
      - 'foundation/**'
      - 'references/**'
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # The frozen archives: never updated, by version or security pull requests.
  - package-ecosystem: npm
    directories:
      - '/foundation/**'
      - '/references/**'
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*'
