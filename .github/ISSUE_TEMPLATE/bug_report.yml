name: Bug report
description: Something in circle-hub does not work the way the docs say it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Keep it short and concrete. Do not paste credentials, internal addresses, business originals or whole user sessions; see SECURITY.md for anything sensitive.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: State the bug in a few sentences. Paste the exact error text or error code if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows it, on synthetic fixtures.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
      description: The commit of circle-hub you ran, and the MCP client and its version (for example Circle) if one is involved.
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: Where it runs
      description: Which part is affected, for example an MCP tool, the console, the circle-hub command, a connector or a pack.
    validations:
      required: true
