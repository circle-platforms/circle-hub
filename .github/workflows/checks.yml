name: Hub checks

# Synthetic fixtures and scripted models only: no job reaches a real system, a real model endpoint or a secret.
# Ubuntu has no sandbox-exec, keychain or launchd, so the tests that need them skip here; the unit jobs install the PostgreSQL 18
# client so that backup, restore and deploy run. The job summary lists every skip; a skip is not a pass. The skipped macOS
# paths run in macos.yml on every push to main, nightly and on demand, and in the local macOS run of each phase (AGENTS.md).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces its running checks; every push to main keeps its own run.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  contracts:
    name: Generated contracts match the model
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify:contracts

  # regular runs in three shards balanced by measured durations (tools/run-unit-tests.ts); parser-bounds stays one single-worker process.
  unit_parts:
    name: Unit tests / ${{ matrix.suite }} ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: regular, shard: 1/3 }
          - { suite: regular, shard: 2/3 }
          - { suite: regular, shard: 3/3 }
          - { suite: parser-bounds, shard: 1/1 }
    env:
      UNIT_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Backup, restore and deploy tests need pg_dump and pg_restore of the embedded server's major version (18), which
      # Ubuntu does not ship; they come from the PostgreSQL apt repository and go first on PATH (hub/platform/backup.ts).
      - name: Install the PostgreSQL 18 client
        if: ${{ matrix.suite == 'regular' }}
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -rqs 'apt.postgresql.org' /etc/apt/sources.list /etc/apt/sources.list.d; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -fsS --retry 3 --max-time 60 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          fi
          sudo timeout 240 apt-get -o Acquire::Retries=3 update
          sudo timeout 240 apt-get -o Acquire::Retries=3 install -y --no-install-recommends postgresql-client-18
          for tool in pg_dump pg_restore; do /usr/lib/postgresql/18/bin/$tool --version | grep -E ' 18\.'; done
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: Run the unit tests
        shell: bash
        run: npm run test:unit -- ${{ matrix.suite }} 2>&1 | tee "$RUNNER_TEMP/unit.log"
      - name: Count what ran and what was skipped
        if: ${{ !cancelled() }}
        run: node .github/checks/test-summary.ts "$RUNNER_TEMP/unit.log" 'Unit tests / ${{ matrix.suite }} ${{ matrix.shard }}'

  unit:
    name: Unit tests
    needs: unit_parts
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every unit partition to pass
        run: test '${{ needs.unit_parts.result }}' = 'success'

  # Four slices balanced by measured file durations (tools/run-acceptance-tests.ts); each file runs in exactly one.
  acceptance_parts:
    name: Acceptance on a temporary PostgreSQL / ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    env:
      ACCEPTANCE_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The tests start and remove their own loopback PostgreSQL through hub/testing/postgres.ts.
      - name: Run the acceptance tests
        shell: bash
        run: npm run test:acceptance 2>&1 | tee "$RUNNER_TEMP/acceptance.log"
      # A slice that ran no test fails here, so no slice is green with nothing run.
      - name: Count what ran and what was skipped
        if: ${{ !cancelled() }}
        run: node .github/checks/test-summary.ts "$RUNNER_TEMP/acceptance.log" 'Acceptance ${{ matrix.shard }}'

  acceptance:
    name: Acceptance on a temporary PostgreSQL
    needs: acceptance_parts
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every acceptance slice to pass
        run: test '${{ needs.acceptance_parts.result }}' = 'success'

  docs:
    name: Docs and CI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .github/checks
      - name: Run the docs and CI checks
        shell: bash
        run: node --test ".github/checks/*.test.ts" 2>&1 | tee "$RUNNER_TEMP/docs.log"
      - name: Count what ran and what was skipped
        if: ${{ !cancelled() }}
        run: node .github/checks/test-summary.ts "$RUNNER_TEMP/docs.log" 'Docs and CI checks'

  references:
    name: Reference archive
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm run verify:references
      - run: npm run test:references
