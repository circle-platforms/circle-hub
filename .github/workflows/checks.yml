name: Hub checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  code:
    name: Types, contracts and methods
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CIRCLE_NO_MODELS_REFRESH: '1'
    steps:
      - name: Isolate Circle data
        run: |
          printf 'CIRCLE_HOME=%s\n' "$(mktemp -d "$RUNNER_TEMP/circle-home.XXXXXX")" >> "$GITHUB_ENV"
          printf 'CIRCLE_WORKBENCH_DATA_DIR=%s\n' "$(mktemp -d "$RUNNER_TEMP/circle-workbench.XXXXXX")" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:contracts
      - run: npm run test:methods

  acceptance:
    name: Synthetic service acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CIRCLE_NO_MODELS_REFRESH: '1'
      # Existing RPC cases report skips without the separately confirmed runtime.
      # Skips are not verified passes and do not upgrade the acceptance baseline.
      CIRCLE_BIN: ''
      CIRCLE_COMMIT: ''
      CIRCLE_RUNTIME_CONFIG: ''
    steps:
      - name: Isolate Circle data
        run: |
          printf 'CIRCLE_HOME=%s\n' "$(mktemp -d "$RUNNER_TEMP/circle-home.XXXXXX")" >> "$GITHUB_ENV"
          printf 'CIRCLE_WORKBENCH_DATA_DIR=%s\n' "$(mktemp -d "$RUNNER_TEMP/circle-workbench.XXXXXX")" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify temporary loopback PostgreSQL
        run: npm run verify:postgres
      - name: Test synthetic services (pinned Circle RPC cases report skips)
        run: npm run test:acceptance
