name: Hub checks

# Synthetic fixtures and scripted models only: no job reaches a real system, a real model endpoint or a secret.
# Ubuntu has no sandbox-exec, keychain, launchd or libpq of the embedded PostgreSQL's major version, so the tests that need
# them skip here. The job summary lists every skip; a skip is not a pass, and those paths are checked on macOS (AGENTS.md).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    name: Types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  contracts:
    name: Generated contracts match the model
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify:contracts

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run the unit tests
        shell: bash
        run: npm run test:unit 2>&1 | tee "$RUNNER_TEMP/unit.log"
      - name: Count what ran and what was skipped
        if: ${{ !cancelled() }}
        run: node .github/checks/test-summary.ts "$RUNNER_TEMP/unit.log" 'Unit tests'

  acceptance:
    name: Acceptance on a temporary PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The tests start and remove their own loopback PostgreSQL through hub/testing/postgres.ts.
      - name: Run the acceptance tests
        shell: bash
        run: npm run test:acceptance 2>&1 | tee "$RUNNER_TEMP/acceptance.log"
      # node --test succeeds when its pattern matches no file; this step fails then, so the job is red until
      # tests/acceptance exists (phase 4), never green with nothing run.
      - name: Count what ran and what was skipped
        if: ${{ !cancelled() }}
        run: node .github/checks/test-summary.ts "$RUNNER_TEMP/acceptance.log" 'Acceptance'

  docs:
    name: Docs and CI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .github/checks
      - name: Run the docs and CI checks
        shell: bash
        run: node --test ".github/checks/*.test.ts" 2>&1 | tee "$RUNNER_TEMP/docs.log"
      - name: Count what ran and what was skipped
        if: ${{ !cancelled() }}
        run: node .github/checks/test-summary.ts "$RUNNER_TEMP/docs.log" 'Docs and CI checks'

  references:
    name: Reference archive
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm run verify:references
      - run: npm run test:references
