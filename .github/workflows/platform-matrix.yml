name: Synthetic native platform matrix

# Synthetic checks only on explicit test branches or manual dispatch. This does not build or publish a release.
on:
  push:
    branches: ['synthetic-platform/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Synthetic (${{ matrix.platform }}-${{ matrix.arch }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { runner: macos-15-intel, platform: darwin, arch: x64 }
          - { runner: macos-15, platform: darwin, arch: arm64 }
          - { runner: windows-2025, platform: win32, arch: x64 }
          - { runner: windows-11-arm, platform: win32, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Check the native architecture and execute synthetic contracts
        run: node .github/checks/platform-matrix.ts ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Execute synthetic Windows native security fixtures
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: node --test --test-reporter=tap --test-concurrency=2 hub/platform/windows-dpapi.test.ts hub/platform/windows-keychain.test.ts
      - name: Execute synthetic Windows native Job fixtures
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: node --test --test-reporter=tap --test-concurrency=2 hub/rules/sandbox/windows.test.ts
      # A real service and a real scheduled task are created under synthetic names and deleted again; one file at a time.
      - name: Execute synthetic Windows service fixtures
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: node --test --test-reporter=tap --test-concurrency=1 hub/platform/windows-service.test.ts hub/platform/windows-scm.test.ts hub/platform/windows-task.test.ts
      # No Windows ARM64 PostgreSQL build exists: install the lockfile's x64 build, checked against its SHA-512, for x64 emulation.
      - name: Install the x64 PostgreSQL build for the Windows ARM64 hybrid
        if: ${{ !cancelled() && runner.os == 'Windows' && matrix.arch == 'arm64' }}
        run: node hub/platform/postgres-hybrid.ts
      - name: Execute synthetic loopback SCRAM PostgreSQL fixtures
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: node --test --test-reporter=tap --test-concurrency=1 hub/platform/postgres-loopback.test.ts hub/platform/postgres-hybrid.test.ts
      - name: Report unsupported Windows release readiness
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: node .github/checks/platform-matrix.ts --windows-readiness
