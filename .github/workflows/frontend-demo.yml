name: Frontend design demo
on:
  push:
    branches: [main, demo/enterprise-platform-ui]
    paths: ['demo/server-ui/**', '.github/workflows/frontend-demo.yml']
  pull_request:
    paths: ['demo/server-ui/**', '.github/workflows/frontend-demo.yml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/server-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: demo/server-ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
